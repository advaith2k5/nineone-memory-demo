[pytest]
pythonpath = src .
testpaths = tests
markers =
    live: calls the real Gemini API (embeddings and/or chat, uses free-tier quota). Tests without this marker
          (lint, stubs, most tool tests) only touch the local database.
    s1: scenario 1 - memory vs skill vs system prompt
    s2: scenario 2 - retrieval
    s3: scenario 3 - conflict resolution
    s4: scenario 4 - garbage in, garbage out
    s5: scenario 5 - insert / delete lifecycle
    s6: scenario 6 - multi-agent scope
    e2e: full worst-cell case
